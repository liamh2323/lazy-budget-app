<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Budgeting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen">
    <header
      class="border-b border-gray-800 px-6 py-4 flex items-center justify-between"
    >
      <h1 class="text-base font-semibold tracking-tight">Lazy Budgeting</h1>
      <button
        id="logout-btn"
        class="text-sm text-gray-400 hover:text-gray-200 transition-colors"
      >
        Logout
      </button>
    </header>

    <nav class="border-b border-gray-800 px-6 flex gap-1">
      <button
        class="tab-btn px-4 py-3 text-sm border-b-2 border-indigo-500 text-indigo-400 transition-colors"
        data-tab="overview"
      >
        Overview
      </button>
      <button
        class="tab-btn px-4 py-3 text-sm border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors"
        data-tab="categories"
      >
        Categories
      </button>
      <button
        class="tab-btn px-4 py-3 text-sm border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors"
        data-tab="merchants"
      >
        Merchants
      </button>
      <button
        class="tab-btn px-4 py-3 text-sm border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-colors"
        data-tab="upload"
      >
        Upload
      </button>
    </nav>

    <main class="p-6 max-w-3xl mx-auto">
      <div id="tab-overview" class="space-y-5">
        <div class="flex items-center gap-3">
          <select
            id="month-select"
            class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500"
          ></select>
          <select
            id="year-select"
            class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500"
          ></select>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
            <p class="text-xs text-gray-400 uppercase tracking-wider">Income</p>
            <p
              id="total-credits"
              class="text-2xl font-semibold mt-1 text-emerald-400"
            >
              —
            </p>
          </div>
          <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
            <p class="text-xs text-gray-400 uppercase tracking-wider">
              Expenses
            </p>
            <p
              id="total-debits"
              class="text-2xl font-semibold mt-1 text-red-400"
            >
              —
            </p>
          </div>
          <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
            <p class="text-xs text-gray-400 uppercase tracking-wider">
              Net Savings
            </p>
            <p id="net-savings" class="text-x1: md:text-2xl font-semibold mt-1">
              —
            </p>
          </div>
        </div>

        <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
          <p class="text-sm font-medium text-gray-300 mb-4">
            Spending by Category (Click each category for more details)
          </p>
          <div class="flex items-center justify-center" style="height: 260px">
            <canvas id="spending-chart"></canvas>
          </div>
          <p
            id="no-chart-data"
            class="hidden text-center text-sm text-gray-500 py-8"
          >
            No spending data for this period.
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
            <p class="text-sm font-medium text-gray-300 mb-4">
              Spending Trends (6 months)
            </p>
            <div style="height: 200px">
              <canvas id="trends-chart"></canvas>
            </div>
          </div>

          <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
            <p class="text-sm font-medium text-gray-300 mb-4">
              Biggest Expenditure
            </p>
            <div id="top-merchants-list" class="space-y-2"></div>
          </div>
        </div>
      </div>

      <div id="tab-categories" class="hidden space-y-3">
        <div id="categories-list" class="space-y-2"></div>
        <div class="flex gap-2 pt-1">
          <input
            id="new-cat-name"
            type="text"
            placeholder="New category name"
            class="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
          />
          <button
            id="add-cat-btn"
            class="bg-indigo-600 hover:bg-indigo-500 rounded px-4 py-2 text-sm transition-colors"
          >
            Add
          </button>
        </div>
      </div>

      <div id="tab-merchants" class="hidden space-y-5">
        <div class="space-y-2">
          <p class="text-xs text-gray-400 uppercase tracking-wider">
            Unmapped Merchants
          </p>
          <div id="unmapped-list" class="space-y-2"></div>
        </div>

        <hr class="border-gray-700" />

        <div id="hidden-merchants-section" class="hidden space-y-2">
          <p class="text-xs text-gray-400 uppercase tracking-wider">
            Hidden Merchants
          </p>
          <div id="hidden-list" class="space-y-2"></div>
          <hr class="border-gray-700" />
        </div>

        <div class="space-y-2">
          <p class="text-xs text-gray-400 uppercase tracking-wider">
            Existing Mappings
          </p>
          <div id="merchants-list" class="space-y-2"></div>
        </div>

        <hr class="border-gray-700" />

        <div class="space-y-2">
          <p class="text-xs text-gray-400 uppercase tracking-wider">
            New Category
          </p>
          <div class="flex gap-2">
            <input
              id="merchants-new-cat-name"
              type="text"
              placeholder="Category name"
              class="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
            />
            <button
              id="merchants-add-cat-btn"
              class="bg-gray-700 hover:bg-gray-600 rounded px-4 py-2 text-sm transition-colors"
            >
              Add Category
            </button>
          </div>
        </div>
      </div>

      <div id="tab-upload" class="hidden">
        <div
          class="bg-gray-800 border border-gray-700 rounded-lg p-6 space-y-4"
        >
          <p class="text-sm font-medium text-gray-300">
            Upload bank statement CSV
          </p>
          <input
            id="csv-file"
            type="file"
            accept=".csv"
            class="block text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-gray-700 file:text-gray-200 hover:file:bg-gray-600 cursor-pointer"
          />
          <button
            id="upload-btn"
            class="bg-indigo-600 hover:bg-indigo-500 rounded px-4 py-2 text-sm transition-colors"
          >
            Upload
          </button>
          <p id="upload-status" class="text-sm text-gray-400"></p>
        </div>
      </div>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
