<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category — Budget App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen">
    <header
      class="border-b border-gray-800 px-6 py-4 flex items-center justify-between"
    >
      <div class="flex items-center gap-3">
        <a
          href="/dashboard.html"
          class="text-sm text-gray-400 hover:text-gray-200 transition-colors"
          >&larr; Dashboard</a
        >
        <h1 id="category-title" class="text-base font-semibold tracking-tight">
          Category
        </h1>
      </div>
      <button
        id="logout-btn"
        class="text-sm text-gray-400 hover:text-gray-200 transition-colors"
      >
        Logout
      </button>
    </header>

    <main class="p-6 max-w-3xl mx-auto space-y-5">
      <div class="flex items-center gap-3">
        <select
          id="month-select"
          class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500"
        ></select>
        <select
          id="year-select"
          class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500"
        ></select>
      </div>

      <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wider">
          Category Total
        </p>
        <p id="category-total" class="text-2xl font-semibold mt-1 text-red-400">
          —
        </p>
      </div>

      <div id="transactions-list" class="space-y-2">
        <p class="text-sm text-gray-500">Loading…</p>
      </div>
    </main>

    <script src="category.js"></script>
  </body>
</html>
